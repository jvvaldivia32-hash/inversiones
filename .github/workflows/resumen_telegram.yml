name: Resumen por Telegram (manual)

# El resumen de cada mañana ya NO sale de acá: lo manda el recolector horario
# (collector/main.py → resumen_telegram.enviar_si_toca), en el primer run del día que caiga
# entre las 07:00 y las 12:00 de Chile.
#
# Por qué se sacó el cron: GitHub bota y encola los eventos `schedule` de este repo desde el
# 26-08-2026 (CLAUDE.md punto 2). Este workflow estaba en '38 11 * * *' —07:38 de Chile— y
# medido de verdad disparó a las 15:44 UTC (29-08) y 15:26 UTC (30-08), o sea 11:26/11:44 de
# Chile, DESPUÉS de que abre el mercado; el 31-08 no disparó en todo el día. Colgado del
# recolector no hay una hora exacta garantizada, pero hay muchos más intentos: en los 8 días
# medidos (24 al 31 de agosto) todos tuvieron al menos un run del recolector dentro de esa
# ventana — incluido el 27, que tuvo 2 runs en 24 horas.
#
# Lo único que da hora fija de verdad es un disparador externo pegándole a
# `workflow_dispatch` (que no sufre el throttling). Está sobre la mesa y sin decidir.
on:
  workflow_dispatch:       # botón manual: manda el resumen ahora, sin mirar hora ni estado

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Sin pip install: este script solo lee data/daily.json y le pega a la API de
      # Telegram con urllib. No necesita feedparser ni nada del resto del collector.
      - run: python collector/resumen_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
