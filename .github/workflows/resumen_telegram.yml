name: Resumen por Telegram (mañana)

on:
  schedule:
    # 11:38 UTC = 07:38 Chile en invierno (UTC-4) y 08:38 en verano (UTC-3) — verificado
    # con zoneinfo, no a ojo. GitHub no entiende husos horarios: el cron es siempre UTC, así
    # que la hora local se corre sola una hora cuando Chile cambia de horario. En los dos
    # casos queda antes de que abra el mercado de EE.UU. (13:30 UTC), con el cierre de ayer
    # ya consolidado, que es lo que importa.
    #
    # Todos los días, fin de semana incluido: el sábado y el domingo repiten el cierre del
    # viernes, y eso es a propósito — el usuario lo pidió así el 2026-08-28 para tenerlo
    # como rutina fija de la mañana, no solo cuando el mercado abre.
    #
    # El minuto no es en punto a propósito: GitHub bota eventos `schedule` cuando su cola
    # está cargada y :00/:30 son los minutos más congestionados (ver la nota en daily.yml).
    - cron: '38 11 * * *'
  workflow_dispatch:       # botón manual

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Sin pip install: este script solo lee data/daily.json y le pega a la API de
      # Telegram con urllib. No necesita feedparser ni nada del resto del collector.
      - run: python collector/resumen_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
