name: Recolector (cada hora)

on:
  schedule:
    # Dos horarios por hora, no dos recolecciones: el de :17 es el principal y el de :47 el
    # respaldo, que solo trabaja si el principal no dejó dato fresco (ver paso "frescura").
    #
    # Por qué no está en :00 como antes: GitHub bota eventos `schedule` sin avisar cuando su
    # cola está cargada, y el minuto :00 es el más congestionado de todo GitHub. Pasó el
    # 26-27 de agosto de 2026 — de ~24 runs al día a 2, con todos los runs que sí corrieron
    # en `success`, los 5 workflows `active`, repo público (minutos ilimitados) y sin
    # incidente abierto en githubstatus.com. La cadencia horaria sigue siendo la decisión
    # consciente del usuario (ver nota en docs/plan-app-inversiones.md junto a la sección 4.1);
    # esto solo la defiende de que GitHub la deje caer.
    - cron: '17 * * * *'   # principal
    - cron: '47 * * * *'   # respaldo
  workflow_dispatch:       # botón manual — siempre recolecta, se saltea el chequeo de frescura

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # El tramo horario de `historico_precios.json` guarda todos los puntos que le llegan
      # (ver compactar() en collector/historico.py), así que recolectar dos veces por hora
      # duplicaría ese archivo — 5,1 MB hoy — a cambio de nada. Este paso hace que el run de
      # respaldo salga en ~10 segundos cuando el principal ya hizo el trabajo.
      - id: frescura
        env:
          # Cualquier disparo que no sea el cron (el botón manual) recolecta igual.
          FORZAR: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: |
          # pipefail: sin esto el exit code del paso es el de `tee`, no el de python, y un
          # crash del script dejaría `correr` vacío — el run terminaría en verde sin haber
          # recolectado nada. Mejor que falle fuerte y se vea.
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import datetime, json, os, pathlib, sys

          # Los dos crons están a 30 min de distancia: si el principal corrió, acá el dato
          # tiene 30 min y el respaldo se saltea; si lo botaron, tiene 60+ y hay que correr.
          MAX_MIN = 45

          if os.environ.get("FORZAR"):
              minutos = float("inf")
          else:
              try:
                  generado = json.loads(pathlib.Path("data/daily.json").read_text())["generado"]
                  ahora = datetime.datetime.now(datetime.timezone.utc)
                  minutos = (ahora - datetime.datetime.fromisoformat(generado)).total_seconds() / 60
              except Exception:
                  minutos = float("inf")  # sin archivo, ilegible o sin fecha: recolectar igual

              # A stderr a propósito: stdout de este script se va entero a $GITHUB_OUTPUT,
              # y Actions rechaza el run entero ante cualquier línea que no sea clave=valor.
              print(f"daily.json generado hace {minutos:.0f} min (umbral: {MAX_MIN})", file=sys.stderr)

          print(f"correr={'si' if minutos >= MAX_MIN else 'no'}")
          PY

      - if: steps.frescura.outputs.correr == 'si'
        run: pip install -r collector/requirements.txt

      - if: steps.frescura.outputs.correr == 'si'
        run: python collector/main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BCCH_API_KEY: ${{ secrets.BCCH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # `git pull --rebase` a secas mata el run si otro run pushueó mientras este recolectaba:
      # daily.json es un snapshot completo, así que el rebase choca en vez de fusionar. Como
      # lo que acabamos de generar es siempre lo más nuevo, ante choque gana — se rearma
      # sobre origin/main en vez de intentar mezclar.
      - if: steps.frescura.outputs.correr == 'si'
        run: |
          git config user.name "recolector"
          git config user.email "bot@users.noreply.github.com"

          nuevo=$(mktemp -d)
          cp data/daily.json data/historico_precios.json data/alertas_enviadas.json data/tesis.json "$nuevo/"

          for intento in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$nuevo/daily.json" "$nuevo/historico_precios.json" "$nuevo/alertas_enviadas.json" data/

            # tesis.json NO se pisa: lo escriben también desde la web (web/api/tesis.ts), así
            # que se fusiona sobre la copia recién traída de origin/main en vez de sobrescribirla.
            python collector/fusionar_tesis.py "$nuevo/tesis.json"

            git add data/daily.json data/historico_precios.json data/alertas_enviadas.json data/tesis.json

            if git diff --staged --quiet; then
              echo "sin cambios que commitear"
              exit 0
            fi

            git commit -q -m "precios: $(date -u +'%Y-%m-%dT%H:%M')"
            git push -q origin main && exit 0
            echo "push rechazado (otro run se adelantó), reintento $intento de 3"
            sleep 5
          done

          echo "::error::no se pudo pushear después de 3 intentos"
          exit 1
