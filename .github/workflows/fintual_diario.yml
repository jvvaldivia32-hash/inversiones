name: Fintual (diario)

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ~ 10:00 Chile (verano) / 09:00 (invierno) — el
                          # valor cuota de un fondo mutuo chileno se actualiza una vez
                          # al día, no cada hora como el resto del collector.
  workflow_dispatch:       # botón manual

jobs:
  fintual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r collector/requirements.txt

      - run: python collector/fintual_diario.py
        env:
          FINTUAL_USER_EMAIL: ${{ secrets.FINTUAL_USER_EMAIL }}
          FINTUAL_USER_TOKEN: ${{ secrets.FINTUAL_USER_TOKEN }}

      - run: |
          git config user.name "recolector"
          git config user.email "bot@users.noreply.github.com"
          git add data/daily.json
          git diff --staged --quiet || git commit -m "fintual: $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase
          git push
