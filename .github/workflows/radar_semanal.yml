name: Radar (semanal)

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC — los fundamentales del universo (~80 tickers)
                          # cambian ~4 veces al año, no tiene sentido evaluarlos cada hora
                          # como al resto del collector (sección 3.2 del plan madre, "~90
                          # tickers, refrescado semanal").
  workflow_dispatch:       # botón manual

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r collector/requirements.txt

      - run: python collector/radar_semanal.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - run: |
          git config user.name "recolector"
          git config user.email "bot@users.noreply.github.com"
          git add data/historico_precios.json data/daily.json
          git diff --staged --quiet || git commit -m "radar: $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase
          git push
