name: Paper investing (aporte mensual)

on:
  schedule:
    - cron: '33 6 1 * *'   # día 1 de cada mes, 06:33 UTC — simula el "sueldo" mensual del
                          # simulador de cartera ficticia, no tiene sentido más seguido.
                          #
                          # El minuto no es en punto a propósito: GitHub bota eventos
                          # `schedule` cuando su cola está cargada y :00/:30 son los minutos
                          # más congestionados (ver la nota larga en daily.yml).

  workflow_dispatch:       # botón manual

jobs:
  aporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python collector/paper_aporte_mensual.py

      - run: |
          git config user.name "recolector"
          git config user.email "bot@users.noreply.github.com"
          git add data/paperinvesting.json
          git diff --staged --quiet || git commit -m "aportes: $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase
          git push
